services:
  target-api:
    build: ./target_app
    ports:
      - "8000:8000"
    environment:
      - SIMULATE_MEMORY_LEAK
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  locust-master:
    image: locustio/locust:2.46.5
    ports:
      - "8089:8089"
    volumes:
      - ./locustfiles:/mnt/locust:ro
      - ./reports:/mnt/reports
    environment:
      - LOAD_SHAPE
      - SOAK_MINUTES
    command: >
      -f /mnt/locust/ecommerce.py
      --master
      --host http://target-api:8000
      --class-picker
    depends_on:
      target-api:
        condition: service_healthy

  locust-worker:
    image: locustio/locust:2.46.5
    volumes:
      - ./locustfiles:/mnt/locust:ro
    environment:
      - LOAD_SHAPE
      - SOAK_MINUTES
    command: >
      -f /mnt/locust/ecommerce.py
      --worker
      --master-host locust-master
    depends_on:
      - locust-master
    deploy:
      replicas: 2

  # --- optional live monitoring: docker compose --profile monitoring up -d ---

  # Turns the master's live JSON stats into Prometheus metrics, percentiles
  # included. Stdlib-only, so it needs no image of its own — see the module
  # docstring for why the off-the-shelf exporter was dropped.
  locust-exporter:
    image: python:3.12-slim
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/locust_exporter.py:/app/locust_exporter.py:ro
    environment:
      - LOCUST_URI=http://locust-master:8089
    command: ["python", "/app/locust_exporter.py"]
    depends_on:
      - locust-master

  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.4.10
    profiles: ["monitoring"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      # only used by `make dashboard-png`; harmless when the renderer is down
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Server-side dashboard rendering, for `make dashboard-png`: a snapshot to
  # attach to a ticket, or to regenerate this repo's README screenshots.
  # Its own profile because it pulls a headless-Chrome image that a normal
  # `make monitoring` has no use for.
  grafana-renderer:
    image: grafana/grafana-image-renderer:v5.12.2
    profiles: ["report"]
