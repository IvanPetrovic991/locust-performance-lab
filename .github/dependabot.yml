# Pins rot quietly: a load test that still runs last year's client is testing
# last year's behaviour. Dependabot keeps the drift visible as pull requests —
# and every one of those pull requests is load-tested by ci.yml before merge,
# which is the whole point of the pipeline.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /target_app
    schedule:
      interval: weekly
    groups:
      target-app:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /target_app
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
