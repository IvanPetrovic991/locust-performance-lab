# This workflow carries the README badge, so it only contains checks whose
# verdict is deterministic: linting, the gate scripts' unit tests, and a load
# test judged against the absolute budgets in config/slas.yml. Run-over-run
# trend comparison lives in nightly.yml, because a gate that compares two noisy
# samples belongs nowhere near a badge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      users:
        description: "Peak concurrent users"
        default: "50"
      duration:
        description: "Test duration (e.g. 2m, 10m); keep under ~25m or raise timeout-minutes"
        default: "2m"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  # The gate scripts decide pass/fail for every load test — so they get their
  # own unit-test job. Untested judges are worse than no judges.
  gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit-test the gate scripts
        run: pytest -q

  load-test:
    runs-on: ubuntu-latest
    needs: gate-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Start target API
        run: |
          docker compose up -d --build --wait target-api || {
            echo "::error::target-api failed its healthcheck — container logs follow"
            docker compose logs target-api
            exit 1
          }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Locust
        run: pip install -r requirements.txt

      # --exit-code-on-error 0: the demo API injects ~1% payment failures by
      # design, and locust's default (any failed request = exit 1) would fail
      # this step before the SLA gate ever ran. The gate is the only judge.
      - name: Run load test
        run: |
          mkdir -p reports
          locust -f locustfiles/ecommerce.py \
            --headless \
            --host http://localhost:8000 \
            -u "${{ inputs.users || '50' }}" \
            -r 10 \
            -t "${{ inputs.duration || '2m' }}" \
            --csv reports/ci --csv-full-history \
            --html reports/ci.html \
            --only-summary \
            --exit-code-on-error 0

      - name: SLA gate
        run: python scripts/check_slas.py reports/ci_stats.csv

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: reports/
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v
